# Serves one page for every failure Traefik hands it. Kept deliberately dumb:
# no upstreams, no dependencies, nothing that can itself be unavailable.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # nginx builds redirects from its own listen port by default, so a request
    # for /pos would be sent to host:8080/pos/ and the browser would follow it
    # off the proxy into nothing. Relative redirects keep whatever scheme, host
    # and port the browser actually used.
    absolute_redirect off;


    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Traefik's errors middleware requests /502, /503 and so on. Every one of
    # them gets the same page, and the status is preserved so crawlers and
    # uptime checks still see a failure rather than a 200.
    location / {
        try_files /index.html =500;
        add_header Cache-Control "no-store";
    }
}
