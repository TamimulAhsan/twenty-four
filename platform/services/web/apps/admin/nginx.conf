# The admin console: one application, one pod, one bundle, its own host.
#
# Served from the root rather than a path prefix, because this application does
# not share an origin with the merchant ones. Four merchant applications sit
# behind one host so the session cookie carries between them; the staff console
# must never be inside that cookie's namespace.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # nginx builds redirects from its own listen port by default, which would
    # send a browser off the proxy into nothing. Relative redirects keep
    # whatever scheme, host and port the browser actually used.
    absolute_redirect off;

    # Hashed assets are immutable; the entry document never is. Getting this
    # wrong either serves a stale app forever or defeats caching entirely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The Admin Gateway is not built yet. Without this the catch-all below
    # would answer an API call with the index document and a 200, and the
    # console would spend its life deciding whether HTML is a session. A JSON
    # 503 is a thing a client can read; when the gateway exists this block
    # becomes a proxy_pass and nothing else changes.
    location /admin/api/ {
        default_type application/json;
        return 503 '{"code":"gateway_unavailable","message":"The admin gateway is not deployed in this environment yet."}';
    }

    # Client-side routing: any path resolves to the entry document and the
    # router takes over.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Liveness and readiness. A fixed path outside the router so a routing
    # mistake cannot make a broken pod look healthy: the catch-all above would
    # answer 200 with the SPA for anything.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
