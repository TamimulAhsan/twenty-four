# Sign in: one application, one pod, one bundle.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # nginx builds redirects from its own listen port by default, so a request
    # for /pos would be sent to host:8080/pos/ and the browser would follow it
    # off the proxy into nothing. Relative redirects keep whatever scheme, host
    # and port the browser actually used.
    absolute_redirect off;


    # Hashed assets are immutable; the entry document never is. Getting this
    # wrong either serves a stale app forever or defeats caching entirely.
    location /auth/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: any path this app owns resolves to its entry
    # document and the router takes over.
    location /auth/ {
        try_files $uri $uri/ /auth/index.html;
        add_header Cache-Control "no-cache";
    }

    # Liveness and readiness. Deliberately not under the app's base path so a
    # routing mistake cannot make a broken pod look healthy.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
