syntax = "proto3";

package twentyfour.payments.v1;

import "google/protobuf/timestamp.proto";
import "twentyfour/common/v1/money.proto";

// PaymentsService is SWAPPED PER MARKET. Hungary and Bangladesh each deploy
// their own implementation of this exact interface; nothing upstream knows
// which one it is talking to.
//
// That makes this file the contract the whole market-swap design rests on, so
// it must stay free of assumptions that only hold in one market:
//   - no field named for a card, a wallet, or any specific rail
//   - no assumption that capture is immediate
//   - no assumption that a refund is free or instant
//   - no currency-specific rounding expected of the caller
//
// POS asks for a payment and gets a result. It never learns that Bangladesh
// answered with a mobile wallet and Hungary with a card.
//
// No request carries a tenant: the gateway resolved it onto the request
// context. Note also what is NOT here. There is no Approve and no Decline,
// because no real provider has such a call. The development provider's manual
// approval screen is its own HTTP surface, outside this contract, exactly where
// a hosted payment page would be.
service PaymentsService {
  // Idempotent on idempotency_key: the same key always returns the same
  // payment, never a second charge. A till that loses its network mid-tender
  // and retries must not double-charge the customer.
  rpc CreateIntent(CreateIntentRequest) returns (CreateIntentResponse);
  rpc Capture(CaptureRequest) returns (CaptureResponse);
  // Gives up on a payment that was never completed. A customer who walked
  // away from the terminal leaves a payment nobody will ever approve, and it
  // must not sit on the provider's books waiting forever.
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc Refund(RefundRequest) returns (RefundResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  // Which tender types this deployment can actually accept. The till renders
  // its buttons from this rather than hardcoding "cash / card".
  rpc ListMethods(ListMethodsRequest) returns (ListMethodsResponse);
  // Everything taken for one reference, or one day's takings. The till and the
  // Payments page both read from here rather than keeping their own list.
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  // Created, awaiting the customer or the terminal.
  PAYMENT_STATUS_PENDING = 1;
  // Funds held but not yet taken. Some markets skip straight to CAPTURED.
  PAYMENT_STATUS_AUTHORIZED = 2;
  PAYMENT_STATUS_CAPTURED = 3;
  PAYMENT_STATUS_FAILED = 4;
  PAYMENT_STATUS_REFUNDED = 5;
  PAYMENT_STATUS_PARTIALLY_REFUNDED = 6;
  PAYMENT_STATUS_CANCELLED = 7;
}

// A way of paying, as this market's implementation defines it. The set is
// open on purpose: "card" and "mobile_wallet" and "cash" are just strings here.
message PaymentMethod {
  // Stable machine key, e.g. "cash", "card_present", "bkash".
  string key = 1;
  // Human label for the till, already in the tenant's language.
  string label = 2;
  // Whether completing this method needs something outside the software:
  // a terminal to be tapped, an app to confirm. The till waits differently.
  bool requires_external_action = 3;
  // Whether the platform ever holds the funds. Cash never does.
  bool electronic = 4;
}

message CreateIntentRequest {
  // Caller-supplied and stable across retries. Required.
  string idempotency_key = 2;
  twentyfour.common.v1.Money amount = 3;
  // Which method the customer chose, from ListMethods.
  string method_key = 4;
  // What is being paid for, so the payment can be reconciled later:
  // e.g. reference_type "order", reference_id the order's ID.
  string reference_type = 5;
  string reference_id = 6;
  map<string, string> metadata = 7;
}
message CreateIntentResponse {
  Payment payment = 1;
  // Set when the customer must be sent somewhere or a terminal must act.
  // Empty for cash and for anything that completes synchronously.
  string external_action_url = 2;
}

message Payment {
  string id = 1;
  reserved 2; // was tenant_id, before the tenant moved to the request context
  string idempotency_key = 3;
  twentyfour.common.v1.Money amount = 4;
  twentyfour.common.v1.Money refunded_amount = 5;
  PaymentStatus status = 6;
  string method_key = 7;
  string reference_type = 8;
  string reference_id = 9;
  // This market's provider reference, for support and reconciliation.
  // Opaque upstream, never parsed by a caller.
  string provider_reference = 10;
  string failure_reason = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp captured_at = 13;
}

message CaptureRequest {
  string payment_id = 2;
  // Omit to capture the full authorised amount.
  twentyfour.common.v1.Money amount = 3;
}
message CaptureResponse {
  Payment payment = 1;
}

message CancelRequest {
  string payment_id = 1;
  // Kept on the payment so support can see why it never completed.
  string reason = 2;
}
message CancelResponse {
  Payment payment = 1;
}

message RefundRequest {
  string payment_id = 2;
  string idempotency_key = 3;
  // Omit to refund everything still refundable.
  twentyfour.common.v1.Money amount = 4;
  string reason = 5;
}
message RefundResponse {
  Payment payment = 1;
}

message GetPaymentRequest {
  // Look up by either. Supplying the idempotency key is how a caller recovers
  // after a crash without knowing whether its request landed.
  string payment_id = 2;
  string idempotency_key = 3;
}
message GetPaymentResponse {
  Payment payment = 1;
}

message ListMethodsRequest {}
message ListMethodsResponse {
  repeated PaymentMethod methods = 1;
}

message ListPaymentsRequest {
  // Narrow to one thing that was paid for. Empty returns the tenant's most
  // recent payments.
  string reference_type = 1;
  string reference_id = 2;
  PaymentStatus status = 3;
  int32 page_size = 4;
}
message ListPaymentsResponse {
  repeated Payment payments = 1;
}
