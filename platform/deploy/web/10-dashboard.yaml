# Merchant dashboard: its own image, its own deployment, scaled independently.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-dashboard
  namespace: twentyfour
  labels: { app: web-dashboard, tier: frontend }
spec:
  replicas: 1
  selector: { matchLabels: { app: web-dashboard } }
  template:
    metadata: { labels: { app: web-dashboard, tier: frontend } }
    spec:
      containers:
        - name: nginx
          image: localhost:5000/twentyfour/web-dashboard:dev
          imagePullPolicy: Always
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: web-dashboard, namespace: twentyfour }
spec:
  selector: { app: web-dashboard }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web-dashboard
  namespace: twentyfour
spec:
  entryPoints: [web]
  routes:
    - match: Host(`app.twentyfour.localhost`) && PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: web-dashboard
          port: 80
      middlewares:
        - name: web-unavailable
