# The admin console: its own image, its own deployment, and its own host.
#
# The host is the load-bearing part. The four merchant applications share
# app.twentyfour.localhost so the session cookie issued on the parent domain
# carries between them; this one must never sit inside that namespace, because
# it is the plane that can see every merchant. Separate host, separate gateway,
# separate auth realm.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-admin
  namespace: twentyfour
  labels: { app: web-admin, tier: frontend }
spec:
  replicas: 1
  selector: { matchLabels: { app: web-admin } }
  template:
    metadata: { labels: { app: web-admin, tier: frontend } }
    spec:
      containers:
        - name: nginx
          image: localhost:5000/twentyfour/web-admin:dev
          imagePullPolicy: Always
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: web-admin, namespace: twentyfour }
spec:
  selector: { app: web-admin }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web-admin
  namespace: twentyfour
spec:
  entryPoints: [web]
  routes:
    # A different host, not a path under the merchant one. In production this
    # sits behind the staff SSO, MFA and IP allowlist the architecture calls
    # for; none of that is modelled in the local cluster, which is exactly why
    # keeping the origin separate matters here too.
    - match: Host(`admin.twentyfour.localhost`) && PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: web-admin
          port: 80
      middlewares:
        - name: web-unavailable
