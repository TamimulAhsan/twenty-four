# Dev-only Postgres. Production uses CloudNativePG with PITR — see graph.html §17.
apiVersion: v1
kind: Secret
metadata: { name: postgres, namespace: twentyfour }
stringData:
  POSTGRES_USER: twentyfour
  POSTGRES_PASSWORD: devpassword
  POSTGRES_DB: twentyfour
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: twentyfour }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:18-alpine
          # Logical decoding is what Debezium reads. It is off by default and
          # cannot be turned on without a restart, so it is set here rather
          # than discovered later by a connector that will not start. The slot
          # and sender counts are one per captured database plus headroom: a
          # connector that cannot get a slot fails silently until somebody
          # goes looking for why a table stopped updating.
          # "postgres" first, because args replaces the image's CMD outright
          # and its entrypoint only initialises the cluster when it can see
          # that it is being asked to run the server.
          args:
            - "postgres"
            - "-c"
            - "wal_level=logical"
            - "-c"
            - "max_replication_slots=10"
            - "-c"
            - "max_wal_senders=10"
          envFrom: [{ secretRef: { name: postgres } }]
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "twentyfour"] }
            initialDelaySeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: twentyfour }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
